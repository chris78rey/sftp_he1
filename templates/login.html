{% extends "base.html" %}
{% block content %}
<div class="login-page">
<div class="card login-card">
  <h1>Bienvenido</h1>
  <p class="subtitle">Ingresa a SFTP HE1 para continuar.</p>
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      {% for category, message in messages %}<p class="{{ 'error' if category == 'error' else 'flash-ok' }}">{{ message }}</p>{% endfor %}
    {% endif %}
  {% endwith %}
  <form method="post">
    <div style="margin-bottom:14px;">
      <label for="username">Usuario</label>
      <input id="username" type="text" name="username" placeholder="Ingresa tu usuario" autocomplete="username" required autofocus>
    </div>
    <div style="margin-bottom:14px;">
      <label for="password">Clave</label>
      <input id="password" type="password" name="password" placeholder="Ingresa tu clave" autocomplete="current-password" required>
    </div>
    <button type="submit">Entrar</button>
  </form>
</div>
</div>
{% endblock %}
